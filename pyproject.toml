[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qwen3-tts"
version = "2.0.0"
description = "Qwen3-TTS integration for Home Assistant - Text-to-Speech with Qwen models"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Core dependencies (provided by Home Assistant)
    "aiohttp>=3.9.5,<4.0.0",
    "voluptuous>=0.14.2,<0.15.0",
    
    # Machine Learning / Deep Learning
    "transformers>=4.57.3,<5.0.0",
    "torch>=2.9.0,<3.0.0",
    "safetensors>=0.5.3,<1.0.0",
    
    # Audio processing
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    "soundfile>=0.12.1,<1.0.0",
    
    # Text processing and tokenization
    "sentencepiece>=0.2.1,<0.3.0",
    "protobuf>=5.29.2,<6.0.0",
    
    # Utilities and type hints
    "typing_extensions>=4.9.0,<5.0.0",
    "packaging>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.5,<1.0.0",
    "black>=24.3.0,<25.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.9.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
